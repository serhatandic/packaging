name: Reusable Build and Publish Citus Package

on:
  workflow_call:
    inputs:
      force_docker:
        required: false
        default: false
        type: boolean

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/all-citus' }}

permissions:
  contents: read

jobs:
  build_package:
    name: Build package
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      citus_version: ${{ steps.meta.outputs.citus_version }}
      pkg_revision: ${{ steps.meta.outputs.pkg_revision }}
      deb_version: ${{ steps.meta.outputs.deb_version }}
      force_docker: ${{ steps.meta.outputs.force_docker }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian/bookworm
        arch: ${{ fromJSON(vars.DEB_BUILD_MULTI_ARCH == 'true' && '["amd64", "arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: develop
          path: tooling
      - run: |
          echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
      - uses: serhatandic/packaging/.github/actions/setup-tools@develop
      - name: Build packages
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "[fork-stub] Would run citus_package for ${PLATFORM}"
          python -c "import tools.packaging_automation.citus_package; print('citus_package module import OK')"
      - name: Pre-GA local install test
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck source=/dev/null
          source pkgvars
          echo "[fork-stub] Would run smoke_test_local_packages ${PLATFORM} ${pkglatest%.citus-*}"
      - name: Publish packages (idempotent)
        if: github.ref == 'refs/heads/all-citus'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "[fork-stub] Skipping packagecloud upload for ${PLATFORM} on ${GITHUB_REF}"
      - name: Export release metadata
        id: meta
        if: github.ref == 'refs/heads/all-citus'
        env:
          FORCE_DOCKER_INPUT: ${{ inputs.force_docker }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # shellcheck source=/dev/null
          source pkgvars
          if [ "${FORCE_DOCKER_INPUT}" = "true" ]; then
            force_docker="true"
          else
            pr_body=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '([.[] | select(.base.ref == "all-citus" and .merged_at != null)] | sort_by(.merged_at) | .[-1].body) // ""' 2>/dev/null) || pr_body=""
            force_docker=$(PR_BODY="${pr_body}" python3 tooling/scripts/release_helpers.py force-docker "$(pwd)" "${EVENT_BEFORE}")
          fi
          echo "Exported metadata: citus_version=${pkglatest%.citus-*} pkg_revision=${pkglatest} deb_version=${pkglatest//_/-} force_docker=${force_docker}"
          printf 'citus_version=%s\npkg_revision=%s\ndeb_version=%s\nforce_docker=%s\n' \
            "${pkglatest%.citus-*}" "${pkglatest}" "${pkglatest//_/-}" "${force_docker}" >> "$GITHUB_OUTPUT"

  post_ga_smoke:
    name: Post-GA package installation smoke
    needs: build_package
    if: github.ref == 'refs/heads/all-citus'
    uses: serhatandic/packaging/.github/workflows/test-package-installation.yml@develop
    with:
      citus_version: ${{ needs.build_package.outputs.pkg_revision }}
      channel: community
      retry_attempts: 6

  dispatch_docker:
    name: Dispatch citusdata/docker update
    needs: [build_package, post_ga_smoke]
    if: github.ref == 'refs/heads/all-citus'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch docker update_version workflow
        env:
          VERSION: ${{ needs.build_package.outputs.citus_version }}
          DEB_VERSION: ${{ needs.build_package.outputs.deb_version }}
          FORCE_DOCKER: ${{ needs.build_package.outputs.force_docker }}
        run: |
          echo "[fork-stub] Would run: gh workflow run update_version.yml --repo serhatandic/docker --ref master -f source_tag=v${VERSION} -f deb_version=${DEB_VERSION} -f force_docker=${FORCE_DOCKER}"
