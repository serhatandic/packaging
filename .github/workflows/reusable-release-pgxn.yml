name: Reusable Release on PGXN

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release_check:
    if: github.ref != 'refs/heads/pgxn-citus'
    name: Release check
    runs-on: ubuntu-24.04
    container: pgxn/pgxn-tools
    steps:
      - uses: actions/checkout@v6
      - run: pgxn-bundle

  release_pgxn:
    if: github.ref == 'refs/heads/pgxn-citus'
    name: Actual Release on PGXN
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: serhatandic/packaging/.github/actions/setup-tools@develop
      - name: Release package
        env:
          MAIN_BRANCH: pgxn-citus
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          # shellcheck source=/dev/null
          source pkgvars
          ./scripts/fetch_and_build_pgxn release
          ls -la "$(pwd)/citus-${pkglatest}.zip"
          unzip -l "$(pwd)/citus-${pkglatest}.zip" | grep META.json
          echo "[fork-stub] Skipping PGXN upload for citus-${pkglatest}.zip"
